version: 2.1

# Checks run on every push and pull request. The deploy job runs only on main, after the checks pass.
#
# The deploy token lives in a CircleCI CONTEXT named usehourly-production (Organization Settings > Contexts),
# restricted to `pipeline.git.branch == "main"`, so branches, pull requests and the check job never see it:
#   CLOUDFLARE_API_TOKEN   token with Workers Scripts:Edit and D1:Edit (in the context only, NOT a project variable)
# Project environment variables to set in CircleCI (Project Settings > Environment Variables):
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
#   D1_DATABASE_ID         the id of your D1 database
#   APP_URL                the public address, for example https://usehourly.app
# Optional: WORKER_NAME, D1_DATABASE_NAME, CUSTOM_DOMAIN (see scripts/ci-wrangler-config.mjs)
#
# AUTH_SECRET is a Worker secret, set once with `npx wrangler secret put AUTH_SECRET`; CI never sees it.

executors:
  node:
    docker:
      - image: cimg/node:22.14
    resource_class: medium

commands:
  install:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  check:
    executor: node
    steps:
      - install
      # The same single command GitHub Actions runs (package.json "ci": Biome, tsc, tests with the coverage floor),
      # plus a JUnit file so CircleCI can show the results.
      - run:
          name: Checks (Biome, types, tests with coverage floor)
          command: npm run ci -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - store_test_results:
          path: test-results

  deploy:
    executor: node
    steps:
      - install
      - run:
          name: Write wrangler.jsonc from the project's environment variables
          command: node scripts/ci-wrangler-config.mjs
      - run:
          name: Apply database migrations
          command: npx wrangler d1 migrations apply DB --remote
      - run:
          name: Build and deploy to Cloudflare
          command: |
            export NEXT_PUBLIC_APP_URL="$APP_URL"
            npm run deploy

  # After the deploy: a real browser looks at the live site (e2e/smoke: every main page, an entry added, edited and
  # deleted, using a throwaway sample account). If it fails twice (the spec retries once), production is put back on the
  # previous version (scripts/rollback-previous.mjs) and the job stays red so it is noticed. Migrations are additive, so
  # the database is not touched by a rollback. Needs CLOUDFLARE_API_TOKEN (from the production context) and
  # CLOUDFLARE_ACCOUNT_ID and APP_URL (project variables).
  smoke:
    docker:
      - image: mcr.microsoft.com/playwright:v1.64.1-jammy
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run: npm ci
      - run:
          name: Wait for the new version to answer
          command: |
            for i in $(seq 1 30); do
              if curl -fsS "$APP_URL/api/health"; then echo; exit 0; fi
              sleep 10
            done
            echo "The site did not answer its health check in 5 minutes"; exit 1
      - run:
          name: Smoke test the live site
          command: E2E_BASE_URL="$APP_URL" npx playwright test e2e/smoke --project=desktop --project=phone
      - run:
          name: Roll back to the previous version
          when: on_fail
          command: node scripts/rollback-previous.mjs
      - run:
          name: Check the site after the rollback
          when: on_fail
          command: sleep 20 && curl -fsS "$APP_URL/api/health"
      - store_artifacts:
          path: e2e/report
          destination: smoke-report
          when: always

workflows:
  build-and-deploy:
    jobs:
      - check
      - deploy:
          context: usehourly-production
          requires:
            - check
          filters:
            branches:
              only: main
      - smoke:
          context: usehourly-production
          requires:
            - deploy
          filters:
            branches:
              only: main
