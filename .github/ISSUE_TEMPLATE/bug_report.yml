name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. **Please do not report security problems here**; email admin@zontakllc.com (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to Week\n2. Click ...\n3. ..."
  - type: input
    id: where
    attributes:
      label: Device and browser
      placeholder: "iPhone 15, Safari / Windows, Chrome 130"
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A screenshot helps. Please blank out names, emails and amounts first.
