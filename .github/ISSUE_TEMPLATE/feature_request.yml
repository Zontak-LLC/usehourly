name: Idea or improvement
description: Suggest something that would make logging time or invoicing easier
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is hard today
      description: Describe the job you are trying to do, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: markdown
    attributes:
      value: UseHourly's promise is that logging a day takes seconds, so ideas that add clicks or screens need a strong reason.
