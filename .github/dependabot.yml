version: 2
updates:
  # Weekly, grouped, so a handful of small pull requests arrive instead of one per package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /bridge
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # init and analyze must be the same version, so they arrive as one pull request.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
