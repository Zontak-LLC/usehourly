name: Browser tests

# The Playwright suite runs on every pull request in CircleCI (the `e2e` job, split across 4 containers, and a release
# waits for it). This workflow is the nightly run and the on-demand run: it runs EVERY spec on the phone too
# (E2E_FULL_PHONE=1). Nightly it also runs the slower sweep that
# clicks every control on every page and fails on any that does nothing.
# It starts its own copy of the app against a throwaway local database; nothing here touches production.

permissions:
  contents: read

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Local config with throwaway secrets
        run: |
          cp wrangler.example.jsonc wrangler.jsonc
          secret=$(openssl rand -hex 32)
          # Dummy provider ids: the tests wait for the "Continue with Google" button as proof the page's script has
          # loaded, and that button only renders when a provider is configured. Nothing here ever calls Google or GitHub.
          printf 'AUTH_SECRET=%s\nAUTH_URL=http://localhost:3029\nAUTH_GITHUB_ID=e2e\nAUTH_GITHUB_SECRET=e2e\nAUTH_GOOGLE_ID=e2e\nAUTH_GOOGLE_SECRET=e2e\n' "$secret" > .dev.vars
          cp .dev.vars .env.local
      # The tests' own database folder is migrated by e2e/start-app.mjs while the app builds (issue 197).
      - run: npm run e2e
        env:
          E2E_FULL_PHONE: "1"
      # Before the sweep: the sweep's json reporter overwrites results.json with its one test (issue 354).
      - name: Slowest 10 tests
        if: always()
        run: npm run e2e:summary
      # Reuses the build from the step above (nothing changed), so only the sweep itself takes time.
      - name: Click every control (nightly and on demand)
        if: github.event_name != 'pull_request'
        run: npm run e2e:sweep
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: e2e/report
          retention-days: 14
