<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline · UseHourly</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fffdf7; color: #2b2418; }
      main { max-width: 28rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 .75rem; }
      p { line-height: 1.5; margin: 0 0 1rem; color: #5b5240; }
      a { display: inline-block; padding: .75rem 1.25rem; border-radius: .75rem; background: #f2b632; color: #2b2418;
        font-weight: 600; text-decoration: none; }
      @media (prefers-color-scheme: dark) {
        body { background: #1a1712; color: #f4efe3; } p { color: #bdb4a0; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>UseHourly needs a connection the first time it opens a page. Once a page has been opened, it opens again without one.</p>
      <p>Time you add while offline is saved on your device and sent when you're back online.</p>
      <a href="/dashboard/today">Try again</a>
    </main>
  </body>
</html>
